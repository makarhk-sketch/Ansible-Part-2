---
- name: Install Apache
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Start and enable Apache
  ansible.builtin.systemd_service:
    name: apache2
    state: started
    enabled: true

- name: Configure Apache
  ansible.builtin.copy:
    content: |
      # Configuration managed by Ansible
      ServerTokens Prod
      ServerSignature Off
    dest: /etc/apache2/conf-enabled/homework.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Apache

- name: Create Apache index page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"

- name: Allow HTTP traffic through UFW
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Check Apache HTTP response
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: 200
    return_content: true
  register: apache_response
