---
- name: Download and extract Apache Kafka
  hosts: servers
  become: true
  gather_facts: false

  vars:
    kafka_version: "3.9.1"
    kafka_archive: "kafka_2.13-{{ kafka_version }}.tgz"
    kafka_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/{{ kafka_archive }}"
    download_path: "/tmp/{{ kafka_archive }}"
    extract_path: "/opt/kafka"

  tasks:
    - name: Create directory for Kafka
      ansible.builtin.file:
        path: "{{ extract_path }}"
        state: directory
        mode: "0755"

    - name: Download Kafka archive
      ansible.builtin.get_url:
        url: "{{ kafka_url }}"
        dest: "{{ download_path }}"
        mode: "0644"

    - name: Extract Kafka archive
      ansible.builtin.unarchive:
        src: "{{ download_path }}"
        dest: "{{ extract_path }}"
        remote_src: true
